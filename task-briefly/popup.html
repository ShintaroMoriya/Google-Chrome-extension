<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>仕事ほどき</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div class="brand-mark" aria-hidden="true">✓</div>
        <div>
          <p class="eyebrow">依頼文を、次の行動へ</p>
          <h1>仕事ほどき</h1>
        </div>
      </header>

      <section class="input-section" aria-labelledby="input-heading">
        <div class="section-heading">
          <h2 id="input-heading">依頼文を貼り付け</h2>
          <button id="readPageButton" class="text-button" type="button">表示中のページから取得</button>
        </div>
        <textarea id="sourceText" rows="9" maxlength="12000" placeholder="例：田中さん、来週火曜までに見積書のたたき台を作成してください。鈴木さんは金曜までに数字を確認願います。私は月曜に顧客へ連絡します。"></textarea>
        <div class="input-footer">
          <span id="characterCount" aria-live="polite">0 / 12,000文字</span>
          <button id="clearButton" class="text-button muted" type="button">クリア</button>
        </div>
        <button id="summarizeButton" class="primary-button" type="button">
          <span>タスクを整理する</span><span aria-hidden="true">→</span>
        </button>
      </section>

      <section class="result-section" aria-labelledby="result-heading">
        <div class="section-heading">
          <div>
            <h2 id="result-heading">整理されたタスク</h2>
            <p id="resultMeta" class="result-meta">文章を入力すると、ここに表示されます。</p>
          </div>
          <button id="copyButton" class="copy-button" type="button" disabled>
            <span aria-hidden="true">⧉</span> コピー
          </button>
        </div>
        <div id="emptyState" class="empty-state">
          <span class="empty-icon" aria-hidden="true">☷</span>
          <p>誰が・いつまでに・何をするかを<br />短い箇条書きでまとめます。</p>
        </div>
        <ul id="taskList" class="task-list" aria-live="polite"></ul>
      </section>

      <details class="help-panel">
        <summary>使い方と整理ルール</summary>
        <p>文章から期限・担当者・依頼内容を読み取り、作業内容は原則5〜30文字に整えます。読み取れない情報は「期限未定」「担当未定」と明記し、推測で補いません。</p>
      </details>

      <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
